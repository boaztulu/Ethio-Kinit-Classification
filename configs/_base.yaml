# Defaults shared across configs.
seed: 1234
split_seed: 1234
amp: true
early_stop_patience: 12

data:
  manifest: results/manifest.json
  index: cache/index.json
  split_path: results/split_paper.json
  win_sec: 3.0
  overlap: 0.5
  batch_size: 32
  num_workers: 4

augment:
  raw:
    gain: true
    gain_db: 6.0
    gaussian: true
    snr_db_range: [20, 35]
    pitch: false        # default off; we ablate on (pitch matters for Kiñit)
    semitones_range: [-2.0, 2.0]
    time_stretch: true
    rate_range: [0.9, 1.1]
  mel:
    spec_aug: true
    n_time_masks: 2
    time_mask_width: 20
    n_freq_masks: 2
    freq_mask_width: 16
  mixup_alpha: 0.2

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 2
  epochs: 60
  label_smoothing: 0.1
  use_class_weight: false
  sampler: class_balanced
